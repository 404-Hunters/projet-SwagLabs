name: Tests BDD Behave + Selenium

on:
  push:
    branches:
      - quentin-automatisation
  pull_request:
    branches:
      - develop
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.14"

jobs:
  test:
    name: Tests Behave – Chrome Headless
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    steps:
      # ── 1. Récupération du code ──────────────────────────────────────────
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      # ── 2. Installation de Python ────────────────────────────────────────
      - name: Configurer Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: "pip"

      # ── 3. Installation des dépendances Python ───────────────────────────
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Installation de Chrome ────────────────────────────────────────
      - name: Installer Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Vérifier la version de Chrome
        run: google-chrome --version || chromium-browser --version

      # ── 5. Lancement des tests Behave ────────────────────────────────────
      - name: Lancer les tests Behave
        run: |
          behave \
            --no-capture \
            --format allure_behave.formatter:AllureFormatter \
            --outfile reports/allure-results \
            --junit \
            --junit-directory reports/junit \
            || true
        env:
          HEADLESS: "true"
          DISPLAY: ""

      # ── 6. Publication des résultats JUnit ───────────────────────────────
      - name: Publier les résultats de tests
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: "reports/junit/*.xml"
          check_name: "Behave – Chrome"
          fail_on_failure: false

      # ── 7. Upload des artefacts Allure ───────────────────────────────────
      - name: Upload des résultats Allure bruts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: reports/allure-results/
          retention-days: 1

      # ── 8. Upload des artefacts divers (screenshots, logs) ───────────────
      - name: Upload des artefacts de test
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-artifacts
          path: |
            screenshots/
            logs/
          retention-days: 14

      # ── 9. Upload des rapports d'échec JSON ──────────────────────────────
      - name: Upload des rapports d'échec JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-reports
          path: reports/failures/
          retention-days: 7

      # ── 9b. Upload des résultats complets (pass + fail) pour la matrice ──
      - name: Upload des résultats complets
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/results/
          retention-days: 7

  # ── Job séparé : création des tickets Jira ────────────────────────────────
  jira:
    name: Tickets Jira par échec
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      # ── 10. Récupération des rapports d'échec JSON ───────────────────────
      - name: Télécharger les rapports d'échec
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: failure-reports
          path: reports/failures/

      # ── 10b. Récupération des résultats complets pour la matrice ─────────
      - name: Télécharger les résultats complets
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-results
          path: reports/results/

      # ── 11. Vérifier s'il y a des échecs ─────────────────────────────────
      - name: Vérifier la présence d'échecs
        id: check
        run: |
          COUNT=$(find reports/failures -name "*.json" 2>/dev/null | wc -l)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "$COUNT scénario(s) en échec détecté(s)"

      # ── 13. Mettre à jour la matrice d'exécution sur chaque ticket Jira ──
      # - Regroupe les résultats par tag tc-cat-XX
      # - Construit la matrice utilisateurs x étapes
      # - Met à jour customfield_10104 sur le ticket Jira correspondant
      - name: Mettre à jour les matrices d'exécution Jira
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, json, base64, urllib.request
          from datetime import datetime
          from collections import defaultdict

          CUSTOM_FIELD  = "customfield_10104"
          JIRA_BASE     = "${{ secrets.JIRA_BASE_URL }}"
          ACTOR         = "${{ github.actor }}"
          RUN_DATE      = datetime.utcnow().strftime("%d/%m/%Y")

          credentials = base64.b64encode(
              f"${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}"
              .encode()
          ).decode()
          headers = {
              "Authorization": f"Basic {credentials}",
              "Content-Type":  "application/json",
          }

          def jira_get(path):
              req = urllib.request.Request(f"{JIRA_BASE}{path}", headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          def jira_put(path, payload):
              req = urllib.request.Request(
                  f"{JIRA_BASE}{path}",
                  data=json.dumps(payload).encode("utf-8"),
                  headers=headers,
                  method="PUT",
              )
              with urllib.request.urlopen(req) as r:
                  return r.status

          # ── 1. Charge tous les résultats (pass + fail) ───────────────────
          # Structure : { "tc-cat-36": { "standard_user": {"steps": [...], "status": "PASS"} } }
          results = defaultdict(dict)

          for path in glob.glob("reports/results/*.json"):
              with open(path, encoding="utf-8") as f:
                  r = json.load(f)
              for tag in r.get("tags", []):
                  if tag.startswith("tc-"):
                      results[tag][r["username"]] = {
                          "steps":  r.get("steps", []),
                          "status": r.get("status", "PASS"),
                      }

          if not results:
              print("Aucun résultat trouvé dans reports/results/")
              exit(0)

          # ── 2. Pour chaque ticket, construit et pousse la matrice ─────────
          ALL_USERS = [
              "standard_user", "problem_user", "locked_out_user",
              "visual_user", "performance_glitch_user", "error_user",
          ]

          for tc_tag, user_data in sorted(results.items()):
              # Récupère la clé Jira depuis le tag @PSD-XX du scénario
              # Ex: tags = ["tc-cat-36", "PSD-42", "web", "sort"]
              first_result = next(iter(user_data.values()))
              issue_key = next(
                  (t for t in first_result.get("tags", []) if t.upper().startswith("PSD-")),
                  None
              )
              if not issue_key:
                  print(f"⚠️  Pas de tag PSD-XX trouvé pour {tc_tag} — ticket ignoré")
                  continue
              issue_key = issue_key.upper()

              # Récupère les étapes depuis le premier user disponible
              first      = next(iter(user_data.values()))
              steps      = first["steps"]
              users_present = list(user_data.keys())

              # ── Construit le texte de la matrice ─────────────────────────
              header_users = " | ".join(
                  u if u in users_present else f"~~{u}~~"
                  for u in ALL_USERS
              )
              header = f"| Étapes du Test (Gherkin) | {header_users} |"
              separator = "|---|" + "---|" * len(ALL_USERS)

              rows = []
              for i, step in enumerate(steps, 1):
                  cells = []
                  for u in ALL_USERS:
                      if u not in user_data:
                          cells.append(" - ")
                      elif user_data[u]["status"] == "PASS":
                          cells.append("✅")
                      else:
                          step_status = user_data[u].get("steps", [{}]*i)[i-1] if i <= len(user_data[u].get("steps",[])) else {}
                          cells.append("❌" if step_status.get("failed") else "✅")
                  rows.append(f"| {i}. {step} | " + " | ".join(cells) + " |")

              # Ligne résultat final
              final_cells = []
              for u in ALL_USERS:
                  if u not in user_data:
                      final_cells.append(" - ")
                  else:
                      final_cells.append("PASS" if user_data[u]["status"] == "PASS" else "FAIL")
              final_row = "| **RÉSULTAT FINAL** | " + " | ".join(final_cells) + " |"

              matrix_text = (
                  f"Date de campagne : {RUN_DATE}\n\n"
                  f"{header}\n{separator}\n"
                  + "\n".join(rows)
                  + f"\n{final_row}\n\n"
                  f"Exécuté par : {ACTOR}"
              )

              # ── Pousse vers Jira en ADF ───────────────────────────────────
              adf_value = {
                  "type": "doc", "version": 1,
                  "content": [{
                      "type": "paragraph",
                      "content": [{"type": "text", "text": matrix_text}]
                  }]
              }

              status = jira_put(
                  f"/rest/api/3/issue/{issue_key}",
                  {"fields": {CUSTOM_FIELD: adf_value}}
              )
              print(f"{'✅' if status == 204 else '❌'} {issue_key} — matrice mise à jour (HTTP {status})")
          EOF

  # ── Job séparé : rapport Allure + GitHub Pages ────────────────────────────
  report:
    name: Rapport Allure + GitHub Pages
    runs-on: ubuntu-latest
    needs: test
    if: always()
    permissions:
      contents: write

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Télécharger les résultats Allure
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results

      - name: Générer le rapport Allure
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: reports/allure-results
          allure_history: allure-history
          keep_reports: 10

      - name: Déployer le rapport sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
