name: Tests BDD Behave + Selenium

on:
  push:
    branches:
      - quentin-automatisation
  pull_request:
    branches:
      - develop
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.14"

jobs:
  test:
    name: Tests Behave – Chrome Headless
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    steps:
      # ── 1. Récupération du code ──────────────────────────────────────────
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      # ── 2. Installation de Python ────────────────────────────────────────
      - name: Configurer Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: "pip"

      # ── 3. Installation des dépendances Python ───────────────────────────
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Installation de Chrome ────────────────────────────────────────
      - name: Installer Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Vérifier la version de Chrome
        run: google-chrome --version || chromium-browser --version

      # ── 5. Lancement des tests Behave ────────────────────────────────────
      - name: Lancer les tests Behave
        run: |
          behave \
            --no-capture \
            --format allure_behave.formatter:AllureFormatter \
            --outfile reports/allure-results \
            --junit \
            --junit-directory reports/junit \
            || true
        env:
          HEADLESS: "true"
          DISPLAY: ""

      # ── 6. Publication des résultats JUnit ───────────────────────────────
      - name: Publier les résultats de tests
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: "reports/junit/*.xml"
          check_name: "Behave – Chrome"
          fail_on_failure: false

      # ── 7. Upload des artefacts Allure ───────────────────────────────────
      - name: Upload des résultats Allure bruts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: reports/allure-results/
          retention-days: 1

      # ── 8. Upload des artefacts divers (screenshots, logs) ───────────────
      - name: Upload des artefacts de test
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-artifacts
          path: |
            screenshots/
            logs/
          retention-days: 14

      # ── 9. Upload des rapports d'échec JSON ──────────────────────────────
      # Ces fichiers sont produits par environment.py (1 fichier = 1 scénario échoué)
      - name: Upload des rapports d'échec JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-reports
          path: reports/failures/
          retention-days: 7

  # ── Job séparé : création des tickets Jira ────────────────────────────────
  jira:
    name: Tickets Jira par échec
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      # ── 10. Récupération des rapports d'échec JSON ───────────────────────
      # continue-on-error : si aucun test n'a échoué, l'artefact n'existe pas
      - name: Télécharger les rapports d'échec
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: failure-reports
          path: reports/failures/

      # ── 11. Vérifier s'il y a des échecs ─────────────────────────────────
      - name: Vérifier la présence d'échecs
        id: check
        run: |
          COUNT=$(find reports/failures -name "*.json" 2>/dev/null | wc -l)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "$COUNT scénario(s) en échec détecté(s)"

      # ── 13. Créer un ticket récapitulatif unique ─────────────────────────
      # Lit tous les JSONs d'échec, construit une description avec un bloc
      # par scénario, et crée un seul ticket Jira pour le run entier.
      - name: Créer le ticket récapitulatif Jira
        if: steps.check.outputs.count > 0
        run: |
          python3 - <<'EOF'
          import glob, json, base64, urllib.request

          reports = sorted(glob.glob("reports/failures/*.json"))

          def adf_text(text):
              """Noeud texte ADF simple."""
              return {"type": "text", "text": str(text)}

          def adf_paragraph(*texts):
              """Paragraphe ADF avec un ou plusieurs noeuds texte."""
              return {"type": "paragraph", "content": list(texts)}

          def adf_code_block(code):
              """Bloc de code ADF."""
              return {
                  "type": "codeBlock",
                  "attrs": {"language": "text"},
                  "content": [adf_text(code)]
              }

          def adf_heading(text, level=3):
              """Titre ADF."""
              return {
                  "type": "heading",
                  "attrs": {"level": level},
                  "content": [adf_text(text)]
              }

          def adf_rule():
              """Séparateur horizontal ADF."""
              return {"type": "rule"}

          def adf_bullet_list(items):
              """Liste à puces ADF."""
              return {
                  "type": "bulletList",
                  "content": [
                      {"type": "listItem", "content": [adf_paragraph(adf_text(item))]}
                      for item in items
                  ]
              }

          # ── Construction du document ADF ─────────────────────────────────
          count      = len(reports)
          workflow   = "${{ github.workflow }}"
          branch     = "${{ github.ref_name }}"
          commit     = "${{ github.sha }}"
          actor      = "${{ github.actor }}"
          allure_url = "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

          content_nodes = [
              adf_paragraph(adf_text(f"{count} scenario(s) en echec lors du run automatique.")),
              adf_heading("Contexte technique", 3),
              adf_bullet_list([
                  f"Workflow : {workflow}",
                  f"Branche  : {branch}",
                  f"Commit   : {commit}",
                  f"Declencheur : {actor}",
                  f"Rapport Allure : {allure_url}",
              ]),
              adf_heading("Detail des echecs", 3),
          ]

          for path in reports:
              with open(path, encoding="utf-8") as f:
                  r = json.load(f)
              step = r.get("failed_step") or {}

              content_nodes += [
                  adf_heading(r["scenario"], 4),
                  adf_bullet_list([
                      f"Utilisateur : {r['username']}",
                      f"Tags        : {', '.join(r['tags'])}",
                      f"Screenshot  : {r['screenshot_path']} (voir artefacts du run)",
                  ]),
                  adf_paragraph(adf_text("Etape en echec :")),
                  adf_code_block(f"{step.get('step_type','')} {step.get('step_name','')}"),
                  adf_paragraph(adf_text("Message d'erreur :")),
                  adf_code_block(step.get("error", "N/A")),
                  adf_rule(),
              ]

          description_adf = {"type": "doc", "version": 1, "content": content_nodes}

          summary = f"[BUG] {count} scenario(s) en echec - {branch} ({commit[:7]})"

          # ── Appel API Jira REST v3 ────────────────────────────────────────
          payload = json.dumps({
              "fields": {
                  "project":     {"key": "PSD"},
                  "issuetype":   {"name": "Bug"},
                  "priority":    {"name": "Medium"},
                  "summary":     summary,
                  "description": description_adf,
              }
          }).encode("utf-8")

          credentials = base64.b64encode(
              f"${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}"
              .encode()
          ).decode()

          req = urllib.request.Request(
              "${{ secrets.JIRA_BASE_URL }}/rest/api/3/issue",
              data=payload,
              headers={
                  "Authorization": f"Basic {credentials}",
                  "Content-Type":  "application/json",
              },
              method="POST",
          )

          with urllib.request.urlopen(req) as resp:
              result = json.load(resp)
              print(f"Ticket cree : {result.get('key')} - {summary}")
          EOF

  # ── Job séparé : rapport Allure + GitHub Pages ────────────────────────────
  report:
    name: Rapport Allure + GitHub Pages
    runs-on: ubuntu-latest
    needs: test
    if: always()
    permissions:
      contents: write

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Télécharger les résultats Allure
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results

      - name: Générer le rapport Allure
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: reports/allure-results
          allure_history: allure-history
          keep_reports: 10

      - name: Déployer le rapport sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
