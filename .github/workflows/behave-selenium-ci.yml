name: Tests BDD Behave + Selenium

on:
  push:
    branches:
      - quentin-automatisation
  pull_request:
    branches:
      - develop
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.14"

jobs:
  test:
    name: Tests Behave – Chrome Headless
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    steps:
      # ── 1. Récupération du code ──────────────────────────────────────────
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      # ── 2. Installation de Python ────────────────────────────────────────
      - name: Configurer Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: "pip"

      # ── 3. Installation des dépendances Python ───────────────────────────
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Installation de Chrome ────────────────────────────────────────
      - name: Installer Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Vérifier la version de Chrome
        run: google-chrome --version || chromium-browser --version

      # ── 5. Lancement des tests Behave ────────────────────────────────────
      - name: Lancer les tests Behave
        run: |
          behave \
            --no-capture \
            --format allure_behave.formatter:AllureFormatter \
            --outfile reports/allure-results \
            --junit \
            --junit-directory reports/junit \
            || true
        env:
          HEADLESS: "true"
          DISPLAY: ""

      # ── 6. Publication des résultats JUnit ───────────────────────────────
      - name: Publier les résultats de tests
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: "reports/junit/*.xml"
          check_name: "Behave – Chrome"
          fail_on_failure: false

      # ── 7. Upload des artefacts Allure ───────────────────────────────────
      - name: Upload des résultats Allure bruts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: reports/allure-results/
          retention-days: 1

      # ── 8. Upload des artefacts divers (screenshots, logs) ───────────────
      - name: Upload des artefacts de test
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-artifacts
          path: |
            screenshots/
            logs/
          retention-days: 14

      # ── 9. Upload des rapports d'échec JSON ──────────────────────────────
      - name: Upload des rapports d'échec JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-reports
          path: reports/failures/
          retention-days: 7

      # ── 9b. Upload des résultats complets (pass + fail) pour la matrice ──
      - name: Upload des résultats complets
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/results/
          retention-days: 7

  # ── Job : mise à jour des matrices d'exécution sur les tickets Jira ────────
  matrix:
    name: Matrices d'exécution Jira
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      # ── 10. Récupération des résultats complets (pass + fail) ─────────────
      - name: Télécharger les résultats complets
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-results
          path: reports/results/

      # ── 11. Mise à jour de la matrice sur chaque ticket de cas de test ────
      - name: Mettre à jour les matrices d'exécution Jira
        run: |
          python3 - <<'EOF'
          import glob, json, base64, urllib.request
          from datetime import datetime
          from collections import defaultdict

          CUSTOM_FIELD = "customfield_10104"
          JIRA_BASE    = "${{ secrets.JIRA_BASE_URL }}"
          ACTOR        = "${{ github.actor }}"
          RUN_DATE     = datetime.utcnow().strftime("%d/%m/%Y")

          credentials = base64.b64encode(
              f"${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}"
              .encode()
          ).decode()
          headers = {
              "Authorization": f"Basic {credentials}",
              "Content-Type":  "application/json",
          }

          def jira_put(path, payload):
              req = urllib.request.Request(
                  f"{JIRA_BASE}{path}",
                  data=json.dumps(payload).encode("utf-8"),
                  headers=headers,
                  method="PUT",
              )
              with urllib.request.urlopen(req) as r:
                  return r.status

          # ── 1. Charge tous les résultats (pass + fail) ───────────────────
          results = defaultdict(dict)

          for path in glob.glob("reports/results/*.json"):
              with open(path, encoding="utf-8") as f:
                  r = json.load(f)
              for tag in r.get("tags", []):
                  if tag.startswith("tc-"):
                      results[tag][r["username"]] = {
                          "steps":  r.get("steps", []),
                          "status": r.get("status", "PASS"),
                          "tags":   r.get("tags", []),
                      }

          if not results:
              print("Aucun résultat trouvé dans reports/results/ — job ignoré")
              exit(0)

          # ── 2. Pour chaque cas de test, construit et pousse la matrice ───
          ALL_USERS = [
              "standard_user", "problem_user", "locked_out_user",
              "visual_user", "performance_glitch_user", "error_user",
          ]

          for tc_tag, user_data in sorted(results.items()):

              first_result = next(iter(user_data.values()))
              issue_key = next(
                  (t for t in first_result.get("tags", []) if t.upper().startswith("PSD-")),
                  None
              )
              if not issue_key:
                  print(f"⚠️  Pas de tag PSD-XX trouvé pour {tc_tag} — ticket ignoré")
                  continue
              issue_key = issue_key.upper()

              steps = first_result["steps"]

              def adf_cell(text, is_header=False):
                  cell_type = "tableHeader" if is_header else "tableCell"
                  return {
                      "type": cell_type,
                      "attrs": {},
                      "content": [{"type": "paragraph", "content": [{"type": "text", "text": str(text)}]}]
                  }

              def adf_row(cells):
                  return {"type": "tableRow", "content": cells}

              header_row = adf_row(
                  [adf_cell("Étapes du Test (Gherkin)", True)]
                  + [adf_cell(u, True) for u in ALL_USERS]
              )

              step_rows = []
              for i, step in enumerate(steps, 1):
                  cells = [adf_cell(f"{i}. {step}")]
                  for u in ALL_USERS:
                      if u not in user_data:
                          cells.append(adf_cell("-"))
                      elif user_data[u]["status"] == "PASS":
                          cells.append(adf_cell("✅"))
                      else:
                          cells.append(adf_cell("❌"))
                  step_rows.append(adf_row(cells))

              tc_id = tc_tag.upper().replace("TC-", "")
              final_cells = [adf_cell("RÉSULTAT FINAL")]
              for u in ALL_USERS:
                  if u not in user_data:
                      final_cells.append(adf_cell("-"))
                  elif user_data[u]["status"] == "PASS":
                      final_cells.append(adf_cell("✅ PASS"))
                  else:
                      final_cells.append(adf_cell(f"❌ BUG-{tc_id}-{u}"))
              final_row_adf = adf_row(final_cells)

              adf_value = {
                  "type": "doc", "version": 1,
                  "content": [
                      {"type": "paragraph", "content": [{"type": "text", "text": f"Date de campagne : {RUN_DATE}"}]},
                      {
                          "type": "table",
                          "attrs": {"isNumberColumnEnabled": False, "layout": "full-width"},
                          "content": [header_row] + step_rows + [final_row_adf]
                      },
                      {"type": "paragraph", "content": [{"type": "text", "text": f"Exécuté par : {ACTOR}"}]},
                  ]
              }

              status = jira_put(
                  f"/rest/api/3/issue/{issue_key}",
                  {"fields": {CUSTOM_FIELD: adf_value}}
              )
              print(f"{'✅' if status == 204 else '❌'} {issue_key} ({tc_tag}) — matrice mise à jour (HTTP {status})")
          EOF

  # ── Job : création d'un ticket de bug par échec ──────────────────────────
  jira:
    name: Ticket de bug Jira
    runs-on: ubuntu-latest
    needs: matrix
    if: always()

    steps:
      # ── 12. Récupération des rapports d'échec JSON ───────────────────────
      - name: Télécharger les rapports d'échec
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: failure-reports
          path: reports/failures/

      # ── 13. Vérifier s'il y a des échecs ─────────────────────────────────
      - name: Vérifier la présence d'échecs
        id: check
        run: |
          COUNT=$(find reports/failures -name "*.json" 2>/dev/null | wc -l)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "$COUNT scénario(s) en échec détecté(s)"

      # ── 14. Créer un ticket de bug par échec ─────────────────────────────
      - name: Créer les tickets de bug Jira
        if: steps.check.outputs.count > 0
        run: |
          python3 - <<'EOF'
          import glob, json, base64, urllib.request
          from datetime import datetime, timezone

          JIRA_BASE  = "${{ secrets.JIRA_BASE_URL }}"
          branch     = "${{ github.ref_name }}"
          commit     = "${{ github.sha }}"
          actor      = "${{ github.actor }}"
          allure_url = "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

          credentials = base64.b64encode(
              f"${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}"
              .encode()
          ).decode()
          headers = {
              "Authorization": f"Basic {credentials}",
              "Content-Type":  "application/json",
          }

          # ── Helpers ADF ──────────────────────────────────────────────────
          def adf_text(text):
              return {"type": "text", "text": str(text)}

          def adf_paragraph(*texts):
              return {"type": "paragraph", "content": list(texts)}

          def adf_code_block(code):
              return {
                  "type": "codeBlock",
                  "attrs": {"language": "text"},
                  "content": [adf_text(code)]
              }

          def adf_heading(text, level=3):
              return {
                  "type": "heading",
                  "attrs": {"level": level},
                  "content": [adf_text(text)]
              }

          def adf_bullet_list(items):
              return {
                  "type": "bulletList",
                  "content": [
                      {"type": "listItem", "content": [adf_paragraph(adf_text(item))]}
                      for item in items
                  ]
              }

          # ── Appels API Jira ──────────────────────────────────────────────
          def create_ticket(summary, description_adf):
              fields = {
                  "project":     {"key": "PSD"},
                  "issuetype":   {"name": "Bug"},
                  "summary":     summary,
                  "description": description_adf,
              }

              payload = json.dumps({"fields": fields}).encode("utf-8")
              req = urllib.request.Request(
                  f"{JIRA_BASE}/rest/api/3/issue",
                  data=payload,
                  headers=headers,
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.load(resp).get("key")
              except urllib.error.HTTPError as e:
                  error_body = e.read().decode("utf-8")
                  print(f"HTTP {e.code} — Reponse Jira : {error_body}")
                  raise

          def transition_to_todo(issue_key):
              req = urllib.request.Request(
                  f"{JIRA_BASE}/rest/api/3/issue/{issue_key}/transitions",
                  headers=headers,
              )
              with urllib.request.urlopen(req) as resp:
                  transitions = json.load(resp)["transitions"]
              todo_id = next(
                  (t["id"] for t in transitions if t["name"].lower() in ("to do", "à faire")),
                  None
              )
              if todo_id:
                  payload = json.dumps({"transition": {"id": todo_id}}).encode("utf-8")
                  req = urllib.request.Request(
                      f"{JIRA_BASE}/rest/api/3/issue/{issue_key}/transitions",
                      data=payload,
                      headers=headers,
                      method="POST",
                  )
                  with urllib.request.urlopen(req):
                      return True
              return False

          # ── Boucle sur chaque fichier d'échec ────────────────────────────
          for path in sorted(glob.glob("reports/failures/*.json")):
              with open(path, encoding="utf-8") as f:
                  r = json.load(f)

              username   = r.get("username", "inconnu")
              scenario   = r.get("scenario", "")
              tags       = r.get("tags", [])
              step       = r.get("failed_step") or {}
              screenshot = r.get("screenshot_path", "")

              # ── Identifiants ─────────────────────────────────────────────
              tc_tag = next((t for t in tags if t.startswith("tc-")), None)
              if tc_tag:
                  tc_id  = tc_tag.upper().replace("TC-", "")
                  bug_id = f"BUG-{tc_id}-{username}"
              else:
                  tc_id  = "UNKNOWN"
                  bug_id = f"BUG-UNKNOWN-{username}"

              # ── Variables contextuelles ──────────────────────────────────
              run_date = datetime.now(timezone.utc).strftime("%d/%m/%Y")

              module = "Inconnu"
              if tc_tag:
                  if   "cat"   in tc_tag: module = "Catalogue"
                  elif "auth"  in tc_tag: module = "Authentification"
                  elif "cart"  in tc_tag: module = "Panier"
                  elif "order" in tc_tag: module = "Commande"

              then_steps = [s for s in r.get("steps", []) if s.startswith("then")]
              expected   = then_steps[-1].replace("then ", "") if then_steps else "Voir le scénario Gherkin"
              obtained   = step.get("error", "N/A")

              summary = f"[BUG] {bug_id}"

              # ── Étapes de reproduction (protégé contre liste vide) ────────
              steps_list = r.get("steps", [])
              steps_block = (
                  {
                      "type": "orderedList",
                      "content": [
                          {"type": "listItem", "content": [adf_paragraph(adf_text(s))]}
                          for s in steps_list
                      ]
                  }
                  if steps_list
                  else adf_paragraph(adf_text("Aucune étape disponible."))
              )

              # ── Description ADF ──────────────────────────────────────────
              description_adf = {
                  "type": "doc", "version": 1,
                  "content": [
                      # ── Titre ─────────────────────────────────────────
                      adf_heading(f"ANOMALIE {bug_id} - Echec du scenario {scenario}", 3),

                      # ── Informations générales ─────────────────────────
                      adf_heading("Informations generales", 3),
                      {"type": "paragraph", "content": [{"type": "text", "text": "ID : ", "marks": [{"type": "strong"}]}, {"type": "text", "text": bug_id}]},
                      {"type": "paragraph", "content": [{"type": "text", "text": "Statut : ", "marks": [{"type": "strong"}]}, {"type": "text", "text": "Ouvert"}]},
                      {"type": "paragraph", "content": [{"type": "text", "text": "Priorite : ", "marks": [{"type": "strong"}]}, {"type": "text", "text": "Majeure"}]},
                      {"type": "paragraph", "content": [{"type": "text", "text": "Severite : ", "marks": [{"type": "strong"}]}, {"type": "text", "text": "Haute"}]},
                      {"type": "paragraph", "content": [{"type": "text", "text": "Module : ", "marks": [{"type": "strong"}]}, {"type": "text", "text": module}]},
                      {"type": "paragraph", "content": [{"type": "text", "text": "Environnement : ", "marks": [{"type": "strong"}]}, {"type": "text", "text": "Test - Chrome - Ubuntu (CI)"}]},
                      {"type": "paragraph", "content": [{"type": "text", "text": "Rapporte par : ", "marks": [{"type": "strong"}]}, {"type": "text", "text": actor}]},
                      {"type": "paragraph", "content": [{"type": "text", "text": "Date : ", "marks": [{"type": "strong"}]}, {"type": "text", "text": run_date}]},

                      # ── Description ────────────────────────────────────
                      adf_heading("Description", 3),
                      adf_paragraph(adf_text(
                          f"Echec automatique detecte sur le scenario '{scenario}' "
                          f"lors de l'execution avec le profil '{username}'."
                      )),

                      # ── Étapes de reproduction ─────────────────────────
                      adf_heading("Etapes de reproduction", 3),
                      steps_block,

                      # ── Résultat obtenu ────────────────────────────────
                      adf_heading("Resultat obtenu", 3),
                      adf_code_block(obtained),

                      # ── Résultat attendu ───────────────────────────────
                      adf_heading("Resultat attendu", 3),
                      adf_paragraph(adf_text(expected)),

                      # ── Impact ─────────────────────────────────────────
                      adf_heading("Impact", 3),
                      adf_paragraph(adf_text(
                          f"Le profil '{username}' ne peut pas effectuer cette action correctement. "
                          f"Risque de regression fonctionnelle sur le module {module}."
                      )),

                      # ── Preuves ────────────────────────────────────────
                      adf_heading("Preuves", 3),
                      adf_bullet_list([
                          f"Screenshot : {screenshot} (voir artefacts du run GitHub Actions)",
                          f"Rapport Allure : {allure_url}",
                      ]),

                      # ── Informations techniques ────────────────────────
                      adf_heading("Informations techniques", 3),
                      adf_code_block(
                          f"Etape en echec : {step.get('step_type', '')} {step.get('step_name', '')}\n"
                          f"Erreur         : {obtained}\n"
                          f"Tags           : {', '.join(tags)}\n"
                          f"Workflow       : ${{ github.workflow }}"
                      ),
                  ]
              }

              # ── Création du ticket et transition ─────────────────────────
              issue_key = create_ticket(summary, description_adf)
              in_todo   = transition_to_todo(issue_key)
              status    = "✅ To Do" if in_todo else "⚠️  Backlog"
              print(f"{issue_key} [{status}] — {summary}")

              # ── Lien vers le ticket de cas de test ───────────────────────
              test_case_key = next(
                  (t.upper() for t in tags if t.upper().startswith("PSD-")),
                  None
              )
              if test_case_key and test_case_key != issue_key:
                  link_payload = json.dumps({
                      "type":         {"name": "Relates"},
                      "inwardIssue":  {"key": issue_key},
                      "outwardIssue": {"key": test_case_key},
                      "comment": {
                          "body": {
                              "type": "doc", "version": 1,
                              "content": [adf_paragraph(
                                  adf_text(f"Bug detecte automatiquement par la CI — {bug_id}")
                              )]
                          }
                      }
                  }).encode("utf-8")
                  link_req = urllib.request.Request(
                      f"{JIRA_BASE}/rest/api/3/issueLink",
                      data=link_payload,
                      headers=headers,
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(link_req):
                          print(f"  🔗 Lie a {test_case_key} (elements associes)")
                  except Exception as e:
                      print(f"  ⚠️  Lien echoue vers {test_case_key} : {e}")
              else:
                  print(f"  ⚠️  Pas de tag PSD-XX dans les tags — lien ignore")
          EOF

  # ── Job séparé : rapport Allure + GitHub Pages ────────────────────────────
  report:
    name: Rapport Allure + GitHub Pages
    runs-on: ubuntu-latest
    needs: jira
    if: always()
    permissions:
      contents: write

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Télécharger les résultats Allure
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results

      - name: Générer le rapport Allure
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: reports/allure-results
          allure_history: allure-history
          keep_reports: 10

      - name: Déployer le rapport sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
